[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-stato"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai>=3.6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
